services:
  frontend:
    build:
      context: .
      args:
        VITE_BRAND_NAME: ${VITE_BRAND_NAME:-StatusGate}
        VITE_BRAND_LOGO_URL: ${VITE_BRAND_LOGO_URL:-}
        VITE_BRAND_LOGO_URL_LIGHT: ${VITE_BRAND_LOGO_URL_LIGHT:-}
        VITE_BRAND_LOGO_URL_DARK: ${VITE_BRAND_LOGO_URL_DARK:-}
        VITE_BRAND_TAGLINE: ${VITE_BRAND_TAGLINE:-Service status monitoring}
        VITE_DEFAULT_SPEED_TEST_URL_TEMPLATE: ${VITE_DEFAULT_SPEED_TEST_URL_TEMPLATE:-}
        VITE_CLOUDFLARE_SPEED_TEST_ORIGIN: ${VITE_CLOUDFLARE_SPEED_TEST_ORIGIN:-}
        VITE_DEFAULT_PROBE_URL: ${VITE_DEFAULT_PROBE_URL:-}
        VITE_INTERNET_PING_HOST: ${VITE_INTERNET_PING_HOST:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
